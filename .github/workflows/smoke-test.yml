name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lets an organization variable choose the LSP ref to test against, see
      # https://github.com/sublimelsp/lsp_smoke_test#testing-against-an-lsp-branch
      LSP_SMOKE_TEST_LSP_REF: ${{ vars.LSP_SMOKE_TEST_LSP_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The server compiles the project with the Elm compiler.
      - name: Install Elm
        run: npm install --global elm@latest-0.19.1 --no-audit --no-fund

      # The server reads the packages that elm.json depends on from Elm's package cache, so download them first. The
      # fixture doesn't compile, so ignore the result.
      - name: Download Elm packages
        working-directory: tests/smoke
        shell: bash
        run: elm make src/Main.elm --output=main.js || true

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Elm syntax, which Sublime Text doesn't include.
          extra-packages: evancz/elm-syntax-highlighting
